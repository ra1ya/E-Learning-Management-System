name: LMS CI

on:
  push:
    branches: [main, hardening/portfolio-fixes]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, dom
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify migrations and demo seed
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate:fresh --seed --force

      - name: Verify routes
        run: php artisan route:list

      - name: Run LMS security tests
        run: php artisan test --filter=LmsSecurityTest

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
